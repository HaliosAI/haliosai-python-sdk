[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "haliosai"
dynamic = ["version"]
description = "Small explicit Python API for Halios guardrails and evaluations"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "HaliosLabs", email = "support@halios.ai" }]
requires-python = ">=3.10"
keywords = [
    "ai", "guardrails", "llm", "safety", "evaluation", "testing",
    "opentelemetry", "observability", "ci-cd",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "respx>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "build>=0.10",
    "twine>=4.0",
]

[project.urls]
Homepage = "https://halios.ai"
Documentation = "https://docs.halios.ai"
Repository = "https://github.com/HaliosAI/haliosai-python-sdk"
Changelog = "https://github.com/HaliosAI/haliosai-python-sdk/releases"

[tool.setuptools.dynamic]
version = { attr = "haliosai._version.__version__" }

[tool.setuptools.packages.find]
include = ["haliosai"]

[tool.setuptools.package-data]
haliosai = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
