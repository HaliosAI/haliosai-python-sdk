name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify version
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          ref = os.environ["GITHUB_REF_NAME"]
          expected = ref[1:] if ref.startswith("v") else ref

          content = Path("haliosai/_version.py").read_text(encoding="utf-8")
          version = re.search(r'__version__\s*=\s*"([^"]+)"', content).group(1)

          assert version == expected, f"Package version {version} != {expected}"
          print(f"Verified release version {expected} matches haliosai.")
          PY
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - shell: bash
        run: |
          python -m venv .smoke
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python_bin=.smoke/Scripts/python
          else
            python_bin=.smoke/bin/python
          fi
          wheel="$(find dist -name '*.whl' -print -quit)"
          "$python_bin" -m pip install "$wheel"
          "$python_bin" -c 'from haliosai import Client, EvaluateResult, EvaluationRun'

  publish:
    needs: install
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
